<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
    <defs>
        <linearGradient id="q-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8E9B0"/>
            <stop offset="22%" stop-color="#E2C766"/>
            <stop offset="48%" stop-color="#C9A227"/>
            <stop offset="75%" stop-color="#9C7A1A"/>
            <stop offset="100%" stop-color="#6E550E"/>
        </linearGradient>
        <linearGradient id="q-shine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF9E0" stop-opacity="0.85"/>
            <stop offset="55%" stop-color="#F8E9B0" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="q-core" cx="50%" cy="38%" r="72%">
            <stop offset="0%" stop-color="#2E5FA8"/>
            <stop offset="45%" stop-color="#1B3A6B"/>
            <stop offset="100%" stop-color="#080F1F"/>
        </radialGradient>
        <linearGradient id="q-blue-ring" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4A7BC8"/>
            <stop offset="100%" stop-color="#0F2547"/>
        </linearGradient>
        <linearGradient id="q-letter-o" x1="20%" y1="10%" x2="80%" y2="90%">
            <stop offset="0%" stop-color="#FFF9E0"/>
            <stop offset="30%" stop-color="#E2C766"/>
            <stop offset="65%" stop-color="#C9A227"/>
            <stop offset="100%" stop-color="#8E6E14"/>
        </linearGradient>
        <linearGradient id="q-letter-g" x1="15%" y1="15%" x2="85%" y2="85%">
            <stop offset="0%" stop-color="#E2C766"/>
            <stop offset="40%" stop-color="#C9A227"/>
            <stop offset="75%" stop-color="#9C7A1A"/>
            <stop offset="100%" stop-color="#6E550E"/>
        </linearGradient>
        <filter id="q-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="q-letter-shadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.65"/>
        </filter>
        <filter id="q-text-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="0.8" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <path id="q-arc-top" d="M 45 160 A 115 115 0 0 1 275 160" fill="none"/>
        <path id="q-arc-bottom" d="M 45 160 A 115 115 0 0 0 275 160" fill="none"/>
    </defs>
    <circle cx="160" cy="160" r="158" fill="url(#q-gold)" filter="url(#q-glow)"/>
    <circle cx="160" cy="160" r="150" fill="#08080A"/>
    <circle cx="160" cy="160" r="144" fill="url(#q-blue-ring)"/>
    <circle cx="160" cy="160" r="136" fill="url(#q-core)"/>
    <path d="M 55 130 A 136 136 0 0 1 265 130" fill="none" stroke="url(#q-shine)" stroke-width="32" stroke-linecap="round" opacity="0.35"/>
    <text font-family="'Playfair Display', Georgia, serif" font-size="21" font-weight="700" letter-spacing="5" fill="url(#q-gold)" filter="url(#q-text-glow)">
        <textPath href="#q-arc-top" startOffset="50%" text-anchor="middle">OBILO GOLD GADGETS</textPath>
    </text>
    <text font-family="'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="700" font-style="italic" letter-spacing="4" fill="url(#q-gold)" filter="url(#q-text-glow)">
        <textPath href="#q-arc-bottom" startOffset="50%" text-anchor="middle">Quality or Nothing</textPath>
    </text>
    <g fill="url(#q-gold)" filter="url(#q-text-glow)">
        <path d="M 22 160 L 27 155 L 32 160 L 27 165 Z"/>
        <path d="M 288 160 L 293 155 L 298 160 L 293 165 Z"/>
    </g>
    <g fill="#FFF9E0" opacity="0.9">
        <circle cx="27" cy="160" r="1.2"/>
        <circle cx="293" cy="160" r="1.2"/>
    </g>
    <g filter="url(#q-letter-shadow)">
        <circle cx="160" cy="160" r="56" fill="none" stroke="url(#q-letter-o)" stroke-width="15" stroke-linecap="round"/>
        <path d="M 122 122 A 56 56 0 0 1 165 106" fill="none" stroke="#FFF9E0" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
        <path d="M 186 140 A 38 38 0 1 0 186 180 L 186 160 L 164 160" fill="none" stroke="url(#q-letter-g)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 186 140 A 38 38 0 0 0 158 122" fill="none" stroke="#FFF9E0" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
        <circle cx="186" cy="160" r="5" fill="#F8E9B0" opacity="0.95"/>
        <circle cx="186" cy="160" r="2.5" fill="#FFF9E0"/>
    </g>
    <circle cx="160" cy="160" r="112" fill="none" stroke="url(#q-gold)" stroke-width="1.6" opacity="0.55"/>
    <g fill="url(#q-gold)" filter="url(#q-glow)">
        <circle cx="160" cy="6" r="4.5"/>
        <circle cx="160" cy="314" r="4.5"/>
    </g>
    <g fill="#FFF9E0" opacity="0.95">
        <circle cx="160" cy="6" r="1.6"/>
        <circle cx="160" cy="314" r="1.6"/>
    </g>
    <path d="M 75 75 A 115 115 0 0 1 245 75" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.3"/>
</svg>